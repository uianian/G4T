sd_version: '1.5'
model_key: /nfs/users/wuqianqian/models/stable-diffusion-v1-5
input_path: examples/data/squirrel
bbox_path: examples/data/squirrel/groundtruth.txt
work_dir: outputs/squirrel
height: 512
width: 512
generation:
  control: softedge
  pnp_attn_t: 0.5
  pnp_f_t: 0.8
  control_scale: 0.7
  guidance_scale: 7.5
  n_timesteps: 50
  negative_prompt: ugly, blurry, low res, cartoon
  prompt:
    edit: a cute brown squirrel with big sparkling eyes gracefully leaping among whimsical
      tree branches, surrounded by glowing fireflies and blooming flowers, in a magical
      forest bathed in golden light. Storybook illustration style, soft lighting,
      gentle pastel tones, delicate textures, fairy tale atmosphere
  location_strong_control: false
  phrase:
  - a cute brown squirrel
  word:
  - squirrel
  latents_path: ${work_dir}/latents
  output_path: ${work_dir}
  chunk_size: 4
  chunk_ord: mix-4
  local_merge_ratio: 0.9
  merge_global: true
  global_merge_ratio: 0.6
  global_rand: 0.5
  align_batch: true
  frame_range:
  - 0
  - 60
  - 1
  frame_ids: null
  save_frame: true
  use_lora: false
self_correcting: false
max_iteration: 0
seed: 123
device: cuda
float_precision: fp16
enable_xformers_memory_efficient_attention: true
base_config: configs/default.yaml
